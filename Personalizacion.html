<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Personalización de Perfil</title>
</head>
<body>

    <h1>Personalización de Perfil</h1>

    <form>

        <p>Nombre:</p>
        <input type="text" placeholder="Escribe tu nombre">

        <p>Edad:</p>
        <input type="number" placeholder="Escribe tu edad">

        <p>Correo:</p>
        <input type="email" placeholder="Escribe tu correo">

        <p>Color favorito:</p>
        <input type="color">

        <p>Lenguaje de programación favorito:</p>
        <input list="lenguajes" placeholder="Selecciona un lenguaje">

        <datalist id="lenguajes">
            <option value="HTML">
            <option value="CSS">
            <option value="JavaScript">
            <option value="Python">
            <option value="Java">
        </datalist>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Cancelar">

    </form>
    <a href="Subir tarea.html">Pagina de subir tarea</a>
    <br><br>
    <a href="Cotizacion de Articulos.html">Cotizacion de Articulos</a>
</body>
</html>
