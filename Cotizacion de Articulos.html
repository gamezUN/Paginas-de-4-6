<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotización de Artículos</title>
</head>
<body>

    <h1>Solicitud de Cotización</h1>

    <form>

        <p>Nombre del cliente:</p>
        <input type="text" placeholder="Escribe tu nombre" required>

        <p>Correo electrónico:</p>
        <input type="email" placeholder="Escribe tu correo" required>

        <p>Artículo:</p>
        <input type="text" placeholder="Nombre del artículo" required>

        <p>Cantidad de artículos (mínimo 5, máximo 20):</p>
        <input type="number" min="5" max="20" placeholder="De 5 a 20" required>

        <br><br>

        <input type="submit" value="Enviar cotización">
        <input type="reset" value="Cancelar">

    </form>
